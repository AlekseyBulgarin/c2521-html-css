<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="navigation">
                <div class="home"><a href="#"><h2>Главная</h2></a></div>
                <div class="settings"><a href="#"><h2>Настройки</h2></a></div>
                <div class="contacts"><a href="#"><h2>Контакты</h2></a></div>
            </div>

            <div class="auth">
                <div class="singin">
                    <h2>Регистрация</h2>
                    <button id="OpenReg">Зарегистрироваться</button>
                </div>
                <div class="login">
                    <h2>Вход</h2>
                    <button id="OpenIn">Войти</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="modal" id="modal">
        <div class="register">
            <form action="#">
                <h1>Регистрация</h1>

                <label>Имя</label>
                <input type="text" placeholder="Введите имя" required>

                <label>Email</label>
                <input type="email" placeholder="example@email.ru" required>

                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль" required>

                <label>Повторите пароль</label>
                <input type="password" placeholder="Повторите пароль" required> 
            
                <button type="submit">Зарегистрироваться</button>
        </form>

            <p class="login-text">Уже есть аккаунт ? 
                <a href="">Войти</a>
            </p>
        </div>
    </div>
<script src="scrtipt.js"></script>
</body>
</html>
