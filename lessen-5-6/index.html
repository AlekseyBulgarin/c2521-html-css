<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой сайт</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>

        <div class="navigation">
            <a href="#">Главная</a>
            <a href="#">Настройки</a>
            <a href="#">Контакты</a>
        </div>

        <div class="auth">
            <button id="openRegister">Регистрация</button>
            <button id="openLogin">Войти</button>
        </div>

    </nav>
</header>

<div class="modal" id="registerModal">

    <div class="modal-window">

        <button class="close" id="closeRegister">×</button>

        <form>

            <h1>Регистрация</h1>

            <label>Имя</label>
            <input
                type="text"
                placeholder="Введите имя"
                required
            >

            <label>Email</label>
            <input
                type="email"
                placeholder="example@email.ru"
                required
            >

            <label>Пароль</label>
            <input
                type="password"
                placeholder="Введите пароль"
                required
            >

            <label>Повторите пароль</label>
            <input
                type="password"
                placeholder="Повторите пароль"
                required
            >

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>

        <p class="bottom-text">
            Уже есть аккаунт?
            <a href="#" id="goLogin">Войти</a>
        </p>

    </div>

</div>

<div class="modal" id="loginModal">

    <div class="modal-window">

        <button class="close" id="closeLogin">×</button>

        <form>

            <h1>Вход</h1>

            <label>Email</label>
            <input
                type="email"
                placeholder="Введите Email"
                required
            >

            <label>Пароль</label>
            <input
                type="password"
                placeholder="Введите пароль"
                required
            >

            <button type="submit">
                Войти
            </button>

        </form>

        <p class="bottom-text">
            Нет аккаунта?
            <a href="#" id="goRegister">
                Зарегистрироваться
            </a>
        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
